name: AWC 2026 forum sync

on:
  schedule:
    - cron: "7 */4 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awc-2026-forum-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'richardm213/atomic-puzzles' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Check Lichess and sync the bracket
        env:
          AWC_SUPABASE_URL: ${{ vars.AWC_SUPABASE_URL }}
          AWC_SUPABASE_ANON_KEY: ${{ vars.AWC_SUPABASE_ANON_KEY }}
          AWC_BRACKET_TOKEN: ${{ secrets.AWC_BRACKET_TOKEN }}
          AWC_PUBLISH: ${{ vars.AWC_PUBLISH }}
        run: node scripts/sync-awc-2026-forum.mjs

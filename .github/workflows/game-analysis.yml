name: Game analysis workers

on:
  schedule:
    - cron: "3-59/5 * * * *"
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Queue workers or opening-cache refresh
        type: choice
        options: [workers, openings]
        default: workers
      once:
        description: Run one pass instead of monitoring the queue for twenty minutes
        type: boolean
        default: false

permissions:
  contents: read

env:
  SUPABASE_URL: https://arkicplonaruvmhhvwxd.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  ATOMICDB_USERNAME: ${{ secrets.ATOMICDB_USERNAME }}
  ATOMICDB_PASSWORD: ${{ secrets.ATOMICDB_PASSWORD }}
  TURSO_MATCHES_DATABASE_URL: ${{ secrets.TURSO_MATCHES_DATABASE_URL }}
  TURSO_MATCHES_AUTH_TOKEN: ${{ secrets.TURSO_MATCHES_AUTH_TOKEN }}
  GAME_ANALYSIS_WORKER_ONCE: ${{ inputs.once && 'true' || 'false' }}

jobs:
  pending:
    if: github.repository == 'richardm213/atomic-puzzles' && github.ref == 'refs/heads/main' && (vars.GAME_ANALYSIS_WORKERS_ENABLED == 'true' || github.event_name == 'workflow_dispatch') && github.event.schedule != '23 * * * *' && inputs.task != 'openings'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      work: ${{ steps.queue.outputs.work }}
    steps:
      - name: Check for queued work before installing dependencies
        id: queue
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`${process.env.SUPABASE_URL}/rest/v1/game_analyses?select=game_id&status=in.(queued,processing)&limit=1`, {
            headers: { apikey: process.env.SUPABASE_SERVICE_ROLE_KEY, Authorization: `Bearer ${process.env.SUPABASE_SERVICE_ROLE_KEY}` },
            signal: AbortSignal.timeout(15_000),
          });
          if (!response.ok) throw new Error(`Queue check returned HTTP ${response.status}`);
          const rows = await response.json();
          if (!Array.isArray(rows)) throw new Error('Invalid queue response');
          appendFileSync(process.env.GITHUB_OUTPUT, `work=${rows.length > 0}\n`);
          JS
  queue:
    needs: pending
    if: needs.pending.outputs.work == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: [poll, submit]
    concurrency:
      group: game-analysis-${{ matrix.task }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Process the shared Supabase queue
        run: npx --yes tsx scripts/run-game-analysis-worker.ts "${{ matrix.task }}"
  openings:
    if: github.repository == 'richardm213/atomic-puzzles' && github.ref == 'refs/heads/main' && (vars.GAME_ANALYSIS_WORKERS_ENABLED == 'true' || github.event_name == 'workflow_dispatch') && (github.event.schedule == '23 * * * *' || inputs.task == 'openings')
    concurrency:
      group: game-analysis-openings
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh stale opening evaluations
        run: npx --yes tsx scripts/run-game-analysis-worker.ts openings
